<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Blue Sky Management · Retired</title>
<meta name="description" content="Blue Sky Management has retired from community management in Sussex County, Delaware. Thank you to everyone we worked with.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 2 15h3v15h22V15h3z' fill='%234AAEE3'/%3E%3Ccircle cx='19' cy='13' r='4.5' fill='%23FBC02D'/%3E%3Crect x='5' y='21' width='22' height='9' fill='%232B317E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Colours taken from the Blue Sky Management logo. The logo is drawn for a
     light background, so the page stays light in dark mode too. */
  :root {
    --sky: #D7ECF9;      /* pale sky behind the logo */
    --haze: #F6FAFD;     /* sky fading toward the horizon */
    --navy: #2B317E;     /* "Management" band */
    --sand: #E9DCCB;     /* beach, softened */
    --sand-ink: #7A5A39; /* text on sand */
    --muted: #4F5B78;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--sky) 0%, var(--haze) 55%, var(--haze) 100%);
    color: var(--navy);
    font-family: "Work Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.65;
    padding-top: env(safe-area-inset-top, 0px);
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    padding: clamp(1.5rem, 6vh, 4rem) 7vw 1rem;
    text-align: center;
  }
  .logo {
    display: block;
    width: clamp(150px, min(46vw, 30vh), 250px);
    height: auto;
    margin: 0 auto clamp(1.25rem, 3.5vh, 2.5rem);
  }
  .eyebrow {
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 8vw, 4rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0.5rem 0 1.25rem;
  }
  p { color: var(--muted); }

  /* The setting sun: rises into view high above the horizon, then sinks all
     the way below it, warming from the logo's yellow through orange and pink
     to purple while a dusk glow spreads along the horizon. */
  .horizon {
    --size: clamp(90px, min(18vw, 15vh), 170px);  /* scales with screen height so the horizon stays in view */
    position: relative;
    height: calc(var(--size) * 1.9);
    overflow: hidden;
  }
  .horizon::before {            /* dusk glow on the horizon */
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 90% at 50% 100%, rgba(242, 84, 125, 0.32), rgba(142, 68, 173, 0.14) 45%, transparent 75%);
    opacity: 0.7;
  }
  .sun {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: var(--size);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #FDE14A 0%, #FBC02D 55%, #F5A524 100%);
    transform: translate(-50%, 35%);  /* without motion: resting mid-set */
  }
  .sun::before,
  .sun::after {                  /* sunset colours, faded in one after another */
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
  }
  .sun::before { background: radial-gradient(circle at 50% 40%, #FFB45A 0%, #FF8A3D 60%, #F06A2E 100%); opacity: 1; }
  .sun::after  { background: radial-gradient(circle at 50% 40%, #F7779A 0%, #E0508A 50%, #8E44AD 100%); opacity: 0.6; }
  @media (prefers-reduced-motion: no-preference) {
    .sun            { animation: set 10s cubic-bezier(.45,.05,.55,.95) 0.6s both; }
    .sun::before    { animation: to-orange 10s linear 0.6s both; }
    .sun::after     { animation: to-dusk 10s linear 0.6s both; }
    .horizon::before { animation: glow 10s ease-in-out 0.6s both; }
    @keyframes set       { from { transform: translate(-50%, -80%); } to { transform: translate(-50%, 102%); } }
    @keyframes to-orange { 0%, 8% { opacity: 0; } 35% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes to-dusk   { 0%, 35% { opacity: 0; } 72%, 100% { opacity: 1; } }
    @keyframes glow      { 0%, 20% { opacity: 0; } 75% { opacity: 1; } 100% { opacity: 0.8; } }
  }

  /* The beach strip under the logo's wave, carried down to the page footer */
  footer {
    background: var(--sand);
    border-top: 3px solid var(--navy);
    padding: 1.1rem 7vw calc(1.4rem + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 0.85rem;
    color: var(--sand-ink);
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.webp" width="1823" height="2000" alt="Blue Sky Management">
    <div class="eyebrow">Sussex County, Delaware</div>
    <h1>We've retired.</h1>
    <p>We're no longer providing community management services. Thank you to the owners, residents, and partners we had the pleasure of working with.</p>
  </main>

  <div class="horizon" aria-hidden="true"><div class="sun"></div></div>
  <footer>© 2026 Blue Sky Management</footer>
</body>
</html>
