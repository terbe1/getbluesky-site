<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Blue Sky Management · Retired</title>
<meta name="description" content="Blue Sky Management has retired from community management in Sussex County, Delaware. Thank you to everyone we worked with.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 2 15h3v15h22V15h3z' fill='%234AAEE3'/%3E%3Ccircle cx='19' cy='13' r='4.5' fill='%23FBC02D'/%3E%3Crect x='5' y='21' width='22' height='9' fill='%232B317E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Colours taken from the Blue Sky Management logo. The logo is drawn for a
     light background, so the page stays light in dark mode too. */
  :root {
    --sky: #D7ECF9;      /* pale sky behind the logo */
    --haze: #F6FAFD;     /* sky fading toward the horizon */
    --navy: #2B317E;     /* "Management" band */
    --sand: #E9DCCB;     /* beach, softened */
    --sand-ink: #7A5A39; /* text on sand */
    --muted: #4F5B78;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--sky) 0%, var(--haze) 55%, var(--haze) 100%);
    color: var(--navy);
    font-family: "Work Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.65;
    padding-top: env(safe-area-inset-top, 0px);
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 40rem;
    margin: 0 auto;
    padding: clamp(2.5rem, 8vh, 5rem) 7vw 2rem;
    text-align: center;
  }
  .logo {
    display: block;
    width: clamp(180px, 46vw, 260px);
    height: auto;
    margin: 0 auto 2.5rem;
  }
  .eyebrow {
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(2.6rem, 8vw, 4rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0.5rem 0 1.25rem;
  }
  p { color: var(--muted); }

  /* The setting sun, sinking behind the beach strip below */
  .horizon {
    position: relative;
    height: clamp(90px, 16vh, 150px);
    overflow: hidden;
  }
  .sun {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: clamp(140px, 26vw, 240px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #FDE14A 0%, #FBC02D 55%, #F5A524 100%);
    transform: translate(-50%, 50%);
  }
  @media (prefers-reduced-motion: no-preference) {
    .sun { animation: set 2.4s cubic-bezier(.3,.6,.2,1) both; }
    @keyframes set { from { transform: translate(-50%, 10%); } to { transform: translate(-50%, 50%); } }
  }

  /* The beach strip under the logo's wave, carried down to the page footer */
  footer {
    background: var(--sand);
    border-top: 3px solid var(--navy);
    padding: 1.1rem 7vw calc(1.4rem + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 0.85rem;
    color: var(--sand-ink);
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.webp" width="1823" height="2000" alt="Blue Sky Management">
    <div class="eyebrow">Sussex County, Delaware</div>
    <h1>We've retired.</h1>
    <p>We're no longer providing community management services. Thank you to the owners, residents, and partners we had the pleasure of working with.</p>
  </main>

  <div class="horizon" aria-hidden="true"><div class="sun"></div></div>
  <footer>© 2026 Blue Sky Management</footer>
</body>
</html>
